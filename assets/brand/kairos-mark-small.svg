<title id="asset-title">Kairos small optical mark</title><desc id="asset-description">Approved Kairos identity: original A circular K with a coral opportunity point, cobalt primary ink. Exact colors: cobalt #203C86, porcelain #F4F5F1, coral #ED765D, mist #8AABE0. All artwork is vector geometry constructed and serialized in Krita. Wider lower slit and a slightly larger opportunity point for 16–32 pixel use.</desc><defs />
